[project]
name = "kp-mcp-bootstrap"
version = "0.4.0"
description = "Shared bootstrap and deterministic discovery engines for KleinPerkins MCP kits."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "tomlkit==0.15.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_mcp_bootstrap"]
