[project]
name = "kp-mcp-testkit"
version = "0.1.0"
description = "Shared test engines for KleinPerkins MCP kits: fixtures, parity, faults, editorial lint, doc-runner."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_mcp_testkit"]
