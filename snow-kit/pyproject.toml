[project]
name = "snow-kit"
version = "0.4.0"
description = "Standalone single-core/dual-surface Snow toolkit (CLI + MCP)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    # Versioned sibling pin (R13): recorded in the built wheel as
    # Requires-Dist: kp-mcp-bootstrap==0.4.0. Dev resolves locally via the
    # [tool.uv.sources] workspace override below.
    "kp-mcp-bootstrap==0.4.0",
    "mcp>=1.28.1",
    "pyyaml>=6.0.3",
    "snowflake-connector-python[secure-local-storage]>=3.18.0",
    "sqlglot>=28.0.0",
]

[project.scripts]
snow-kit = "snow_kit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "kp-mcp-testkit==0.1.0",
]

[tool.uv.sources]
kp-mcp-bootstrap = { workspace = true }
kp-mcp-testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snow_kit"]

[tool.hatch.build.targets.wheel.force-include]
"docs/INTENTS.md" = "snow_kit/docs/INTENTS.md"
