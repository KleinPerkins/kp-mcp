[project]
name = "widget-kit"
version = "0.3.0"
description = "Standalone single-core/dual-surface Widget toolkit (CLI + MCP)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    # Versioned sibling pin (R13): recorded in the built wheel as
    # Requires-Dist: kp-mcp-bootstrap==0.4.0. Dev resolves locally via the
    # [tool.uv.sources] workspace override below.
    "kp-mcp-bootstrap==0.4.0",
    "mcp>=1.28.1",
    # Add your domain's API client libraries here.
]

[project.scripts]
widget-kit = "widget_kit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "kp-mcp-testkit==0.1.0",
]

[tool.uv.sources]
kp-mcp-bootstrap = { workspace = true }
kp-mcp-testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/widget_kit"]
